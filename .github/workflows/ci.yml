name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify every pinned dep in pyproject.toml matches requirements.lock
        # Deterministic: reads [project].dependencies from pyproject.toml,
        # verifies the lockfile pins the same version for each direct dep.
        # Does NOT re-resolve (transitive deps are out of scope; Trivy +
        # Dependabot alerts cover those). Catches the actual drift: edits
        # to pyproject.toml that don't propagate to the lockfile.
        run: |
          python3 <<'PYEOF'
          import re, sys, pathlib, tomllib
          def norm(name):
              return re.sub(r"[._-]+", "-", name.lower())
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data.get("project", {}).get("dependencies", [])
          lock_text = pathlib.Path("requirements.lock").read_text()
          fail = False
          for dep in deps:
              m = re.match(r"^([A-Za-z0-9._-]+)(?:\[[^\]]+\])?==(\S+)\s*$", dep)
              if not m:
                  continue
              pkg, ver = norm(m.group(1)), m.group(2)
              hit = re.search(rf"(?im)^{re.escape(pkg)}==(\S+?)(?:\s|\\|$)", lock_text)
              if not hit:
                  print(f"::error file=pyproject.toml::{m.group(1)}=={ver} pinned in pyproject.toml but missing from requirements.lock")
                  fail = True
              elif hit.group(1) != ver:
                  print(f"::error file=pyproject.toml::{m.group(1)}: pyproject.toml pins =={ver} but requirements.lock has =={hit.group(1)}. Regenerate with: uv pip compile pyproject.toml -o requirements.lock --generate-hashes --python-version 3.13")
                  fail = True
          sys.exit(1 if fail else 0)
          PYEOF

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=anthropic_tracker --cov-report=term-missing

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          tags: anthropic-tracker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance produce a manifest list, which the docker
          # exporter can't load. This is a scan-only build (not published),
          # so skip both. Provenance/SBOM belong on the publish workflow.
          sbom: false
          provenance: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anthropic-tracker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
